    httpStatus: 200
    note: Apache-2.0. Contains both harvested OpenAPI documents, the Fern generator config, and fetch-and-cleanup-spec.sh.
  - url: https://raw.githubusercontent.com/nokia/network-as-code-sdks/main/openapi/rapid-spec-oas.json
    type: OpenAPI
    httpStatus: 200
  - url: https://raw.githubusercontent.com/nokia/network-as-code-sdks/main/openapi/Single-NaC-API-OAS.yaml
