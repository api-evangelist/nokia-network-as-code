summary: 'Nokia publishes no AsyncAPI document, but the event surface is real, specified and substantial:
  the CAMARA subscription model. A consumer POSTs a subscription carrying a sink URL and a sinkCredential
  object (credentialType ACCESSTOKEN), names the event types it wants, and Nokia POSTs CloudEvents to
  that sink. Twenty-eight distinct CloudEvent types are named across the two specifications, and the OIDC
  scope for a subscription names the exact event type it authorises (e.g. geofencing-subscriptions:org.camaraproject.geofencing-subscriptions.v0.area-entered:create),
  so consent is event-granular. The webhook receiver is consumer-hosted; Nokia does not sign notifications
  with a published scheme, it authenticates to the sink with the credential the consumer supplied.'
