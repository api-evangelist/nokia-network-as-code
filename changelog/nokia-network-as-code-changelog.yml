summary: >-
  Nokia publishes no dated API changelog. The developer portal has a /blog but
  no release-notes surface, the hub is a client-rendered SPA with no crawlable
  changelog, and neither specification carries version history. What does exist
  is a genuine, dated release train: both first-party SDKs are regenerated from
  the OpenAPI and published in lock step, so their registry histories are the
  public record of when the contract moved. Twenty-four Python releases and
  twenty-three TypeScript releases since December 2023, with the two lines
  converging on a shared version number at 10.0.0 on 2026-06-05.
