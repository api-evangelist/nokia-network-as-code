summary: 'Nokia publishes a hosted MCP server for Network as Code and two complete OpenAPI documents,
  but the two surfaces cannot be bound to each other from outside an account. The MCP server at mcp.prodeu.apihub.nokia.io
  answers only GET / with a version document; every transport path returns 404 anonymously, no OAuth discovery
  document is served, and Nokia publishes no llms.txt and no static tool list, so there is no published
  tool inventory to map. This crosswalk therefore records an honest empty binding and a complete REST-only
  inventory: 78 gateway operations across seven capability families, any of which an authenticated introspection
  can later be bound to. Nothing here is inferred - no tool name is asserted that Nokia has not published.'
