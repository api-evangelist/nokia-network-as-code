summary: >-
  Nokia runs many small lifecycles rather than one platform lifecycle. Versions
  live in the URI path per capability and several generations run side by side,
  which is generous to integrators but means there is no single "current
  version" to pin. Against that, the operational transparency is thin: no
  deprecated operation is flagged anywhere in the published contracts, no
  Deprecation or Sunset header is declared, no deprecation policy page was
  found, and no status page exists for the Network as Code platform on any
  probed host. The only public dated record of change is the SDK release
  history, which is regular enough to read as a proxy release train.
versioning:
  scheme: uri-path, per capability
  platform_version: none published
  concurrent_versions:
    - {capability: Quality on Demand, versions: ['v0.10.1 (/qod/v0)', 'v1.0.0 (/quality-on-demand/v1)']}
