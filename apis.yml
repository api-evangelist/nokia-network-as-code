apis:
  - aid: nokia-network-as-code:network-as-code-platform-api
    name: Nokia Network as Code Platform API
    description: >-
      The single aggregated Network as Code API surface published by Nokia as
      one OpenAPI 3.0 document. The harvested specification declares 58 paths /
      78 operations spanning device status, location, geofencing, quality on
      demand, network slicing, congestion insights, OAuth2 and a
      /passthrough/camara/v1/* namespace that proxies CAMARA identity and
      anti-fraud APIs. All traffic is served through the RapidAPI Enterprise
      Hub gateway host network-as-code.p-eu.rapidapi.com and authenticated with
      an x-rapidapi-key API key at the gateway, layered over CAMARA two-legged
      and three-legged OAuth2 access tokens for subscriber-scoped calls.
    humanURL: https://networkascode.nokia.io/docs
    baseURL: https://network-as-code.p-eu.rapidapi.com
    tags:
      - Network APIs
      - CAMARA
      - Aggregator
      - 5G
    properties:
      - type: OpenAPI
        url: openapi/nokia-network-as-code-platform-openapi.json
      - type: Documentation
        url: https://networkascode.nokia.io/docs
      - type: GettingStarted
        url: https://networkascode.nokia.io/docs/getting-started
      - type: SourceCode
        url: https://github.com/nokia/network-as-code-sdks
      - type: Overlay
        url: overlays/nokia-network-as-code-platform-overlay.yaml
      - type: ErrorCatalog
        url: errors/nokia-network-as-code-problem-types.yml
      - type: DataModel
        url: data-model/nokia-network-as-code-data-model.yml
  - aid: nokia-network-as-code:camara-network-api
    name: Nokia Network as Code CAMARA API
    description: >-
      Nokia's consolidated CAMARA-conformant network API specification,
      published as Single-NaC-API-OAS.yaml in the public network-as-code-sdks
      repository. OpenAPI 3.0.3, 52 paths / 70 operations, declaring
      x-camara-commonalities 0.4.0 and CAMARA-standard tags for geofencing
      subscriptions, location retrieval, location verification, device
      reachability and roaming status (retrieve and subscribe), phone number
      verify and share, KYC age verification / match / tenure / fill-in, device
      swap retrieve-date and check, and QoS sessions. Declared security is
      oAuth2ClientCredentials with an openIdConnect scheme; asynchronous
      notifications use the CAMARA sink + CloudEvents webhook pattern.
    humanURL: https://github.com/nokia/network-as-code-sdks
    baseURL: https://network-as-code.p-eu.rapidapi.com
    tags:
      - CAMARA
      - Network APIs
      - Standards
    properties:
      - type: OpenAPI
        url: openapi/nokia-network-as-code-camara-openapi.yml
      - type: SourceCode
        url: https://github.com/nokia/network-as-code-sdks
      - type: Documentation
        url: https://networkascode.nokia.io/docs
      - type: Overlay
        url: overlays/nokia-network-as-code-camara-overlay.yaml
      - type: OAuthScopes
        url: scopes/nokia-network-as-code-scopes.yml
  - aid: nokia-network-as-code:digital-identity-and-anti-fraud
    name: Network as Code Digital Identity and Anti-Fraud APIs
    description: >-
      The identity and anti-fraud product family. Capabilities advertised by the
      platform configuration are Call Forwarding Signal, Device Swap, KYC Age
      Verification, KYC Fill-in, KYC Match, Location Verification, Number
      Verification and SIM Swap. Every one of these is present in the harvested
      OpenAPI, most of them under /passthrough/camara/v1/* — for example
      /passthrough/camara/v1/sim-swap/sim-swap/v0/check and
      /passthrough/camara/v1/number-verification/number-verification/v2/verify.
      Number Recycling v0.2 and Consent Info v0.1.0 also appear.
    humanURL: https://networkascode.nokia.io/products/digital-identity-and-anti-fraud
    baseURL: https://network-as-code.p-eu.rapidapi.com
    tags:
      - Identity Verification
      - Anti-Fraud
      - SIM Swap
      - Number Verification
      - KYC
    properties:
      - type: Documentation
        url: https://networkascode.nokia.io/products/digital-identity-and-anti-fraud
      - type: OpenAPI
        url: openapi/nokia-network-as-code-platform-openapi.json
  - aid: nokia-network-as-code:device-intelligence
    name: Network as Code Device Intelligence APIs
    description: >-
      The device-state product family — Device Reachability Status, Device
      Reachability Status Subscriptions, Device Roaming Status, Device Roaming
      Status Subscriptions, Geofencing Subscriptions and Location Retrieval.
      Confirmed in the harvested specification at
      /device-status/device-reachability-status/v1/retrieve,
      /device-status/device-roaming-status/v1/retrieve,
      /device-status/*-subscriptions/v0.7 and v0.8/subscriptions,
      /geofencing-subscriptions/v0.3/subscriptions,
      /location-retrieval/v0/retrieve and /location-verification/v0|v1/verify.
    humanURL: https://networkascode.nokia.io/products/device-intelligence
    baseURL: https://network-as-code.p-eu.rapidapi.com
    tags:
      - Device Status
      - Device Location
      - Geofencing
      - Roaming
    properties:
      - type: Documentation
        url: https://networkascode.nokia.io/products/device-intelligence
      - type: OpenAPI
        url: openapi/nokia-network-as-code-platform-openapi.json
  - aid: nokia-network-as-code:programmable-connectivity
    name: Network as Code Programmable Connectivity APIs
    description: >-
      The network-control product family — Quality on Demand, Specialized
      Networks / Network Slice Management, Network Slice Device Attachment,
      Network Slice Application Attachment and eSIM Provisioning. The harvested
      specification confirms /quality-on-demand/v1/sessions (plus extend and
      retrieve-sessions), the older /qod/v0/sessions, /slice/v1/slices with
      activate and deactivate, and /device-attach/v0/attachments. eSIM
      provisioning is advertised as a capability but no eSIM path appears in the
      harvested specification.
    humanURL: https://networkascode.nokia.io/products/programmable-connectivity
    baseURL: https://network-as-code.p-eu.rapidapi.com
    tags:
      - Quality on Demand
      - Network Slicing
      - 5G
      - eSIM
    properties:
      - type: Documentation
        url: https://networkascode.nokia.io/products/programmable-connectivity
      - type: OpenAPI
        url: openapi/nokia-network-as-code-platform-openapi.json
  - aid: nokia-network-as-code:network-intelligence
    name: Network as Code Network Intelligence APIs
    description: >-
      The network-analytics product family. Advertised capabilities are
      Congestion Insights, Network Aware Route Optimization, Population Density
      Data and Consent and Identity Management. Only two are callable in the
      harvested specification — /congestion-insights/v0/query and
      /congestion-insights/v0/subscriptions, and consent via
      /passthrough/camara/v1/consent-info/consent-info/v0.1/retrieve. No
      population-density or route-optimization path exists in the harvested
      specification, so those two are marketed capabilities without a published
      contract.
    humanURL: https://networkascode.nokia.io/products/network-intelligence
    baseURL: https://network-as-code.p-eu.rapidapi.com
    tags:
      - Network Intelligence
      - Congestion
      - Consent
    properties:
      - type: Documentation
        url: https://networkascode.nokia.io/products/network-intelligence
      - type: OpenAPI
        url: openapi/nokia-network-as-code-platform-openapi.json
  - aid: nokia-network-as-code:authorization-server
    name: Network as Code Authorization Server
    description: >-
      The platform's OAuth2 / OpenID Connect surface, tagged "NaC Authorization
      Server" and "Well Known Metadata" in the harvested specification. Real
      operations are GET /oauth2/v1/auth/clientcredentials (issue or return the
      caller's client credentials), GET
      /oauth2/v1/apps/{nac_app_ref}/.well-known/jwks.json, GET
      /.well-known/openid-configuration and GET
      /.well-known/oauth-authorization-server. The well-known documents are
      served behind the RapidAPI gateway and are not anonymously retrievable —
      an unauthenticated GET returns HTTP 404 or 429. CAMARA CIBA
      (Client-Initiated Backchannel Authentication) does not appear anywhere in
      either harvested specification.
    humanURL: https://networkascode.nokia.io/docs/getting-started
    baseURL: https://network-as-code.p-eu.rapidapi.com
    tags:
      - OAuth2
      - OpenID Connect
      - Authentication
    properties:
      - type: OpenAPI
        url: openapi/nokia-network-as-code-platform-openapi.json
      - type: GettingStarted
        url: https://networkascode.nokia.io/docs/getting-started
