aid: nokia-network-as-code
url: https://raw.githubusercontent.com/api-evangelist/nokia-network-as-code/refs/heads/main/apis.yml
name: Nokia Network as Code
kind: company
description: >-
  Nokia Network as Code is the network-API exposure and aggregation platform
  operated by Nokia Oyj from Espoo, Finland, launched in September 2023 to make
  CAMARA-standardised mobile network capabilities commercially reachable by
  ordinary application developers. It sits in the middle of the telecom value
  chain: beneath it, Nokia's Network Exposure Platform (NEP) is deployed inside
  a mobile operator's core to expose that operator's network; above it, the
  Network as Code developer platform aggregates many operators' networks behind
  one contract, one credential and one set of SDKs, so a developer integrates
  once instead of negotiating per-carrier. Nokia states more than 75 partners
  in the ecosystem — telecom providers, CPaaS platforms, systems integrators
  and vertical ISVs — with named operator agreements including Deutsche Telekom,
  Globe (Philippines), Orange (France and Spain), Rakuten Mobile, Tata
  Communications, Telefónica, TELUS and Vodafone (UK, Netherlands, Germany,
  Spain, Greece). Its API posture is unusually open for this tier and should be
  read honestly: the full platform OpenAPI is published verbatim in a public
  Apache-2.0 GitHub repository (nokia/network-as-code-sdks), generated Python
  and TypeScript SDKs ship on PyPI and npm, signup at networkascode.nokia.io is
  self-serve and a SIMULATOR plan exists — but the developer console, the API
  catalogue and the in-portal specification viewer all sit behind a login wall,
  the documentation site is a client-rendered SPA that returns HTTP 200 for any
  path and serves no crawlable content, and reaching a real subscriber on a real
  network in a given market still depends on Nokia having a commercial agreement
  with that market's operator. The platform is delivered through a white-labelled
  RapidAPI Enterprise Hub, and every production call is routed through the
  RapidAPI gateway host network-as-code.p-eu.rapidapi.com rather than a
  Nokia-owned API hostname. Nokia reaches the market directly and through Google
  Cloud Marketplace rather than through Aduna, the rival Ericsson-led carrier
  joint venture.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
