summary: >-
  There is no Network as Code trust centre - no trust.networkascode.nokia.io, no
  product compliance page, no SOC 2 report request flow, and nothing about
  subprocessors or data residency for the platform beyond the supplemental
  privacy notice. What exists is Nokia's corporate security section, which is
  substantive and organised into named areas (trusted performance, product
  security, service security, cybersecurity, supply chain security, security
  compliance) and does name a real certification and a real regulatory
  programme. Read it as parent-company assurance, not product attestation.
