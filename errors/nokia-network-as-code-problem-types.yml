format: camara-errorinfo
format_note: 'Not RFC 9457. Neither specification serves application/problem+json anywhere. Both use the
  CAMARA Commonalities ErrorInfo envelope - a plain application/json object with three fields: status
  (the HTTP status repeated in the body), code (a SCREAMING_SNAKE_CASE machine token, dotted with the
  API name for API-specific errors, e.g. LOCATION_RETRIEVAL.MAXAGE_INVALID_ARGUMENT) and message (human-readable).
  Each response schema is generated per API version, e.g. ErrorInfo-QoD-V0, so there are hundreds of structurally
  identical ErrorInfo-* schemas rather than one shared component.'
envelope:
  media_type: application/json
  fields:
  - name: status
    type: integer
    description: HTTP status code, repeated in the body.
  - name: code
    type: string
    description: Machine-readable error token. Generic CAMARA tokens are undotted; API-specific tokens
      are prefixed with the API name and a dot.
  - name: message
    type: string
    description: Human-readable explanation, safe to log, not intended for end users.
correlation:
  header: x-correlator
  note: CAMARA Commonalities 0.4.0 request/response correlation header; present on operations across both
    documents. Echo it on every call and quote it in support tickets.
agent_notes:
- 'UNNECESSARY_IDENTIFIER (422, 13 operations) and MISSING_IDENTIFIER (422, 14 operations) are the token-model
  tell: a phoneNumber MUST be supplied with a two-legged (client-credentials) token and MUST NOT be supplied
  with a three-legged (subscriber-consented) token. An agent that guesses the token type will oscillate
  between these two errors.'
- SERVICE_NOT_APPLICABLE (422, 16 operations) is the aggregator boundary - the request is well formed
  but the serving operator does not offer that capability for that subscriber. It is not retryable and
  must not be treated as a transient failure.
- QUOTA_EXCEEDED and TOO_MANY_REQUESTS both map to 429 with no Retry-After header published in either
  specification; back off on a client-side schedule.
