summary: '588 schemas are declared in the gateway export, but the entity graph behind them is small. Because
  Nokia ships every CAMARA API version side by side in one document, the generator suffixes each schema
  with its API and version (Device-QoD-V1, Device-DS-ROS-V080, ...), so the same handful of entities repeats
  dozens of times with no shared component. Device is the hub of the whole model: every capability in
  the catalogue is a question asked about, or an action taken on, one Device. There are no provider-issued
  object id prefixes - the only server-minted identifiers are sessionId and subscriptionId, both plain
  UUIDs.'
schema_count: 588
schema_family_count: 291
duplication_note: 'The 588 schemas collapse to 291 name families once the -<API>-V<version> suffix is
  stripped. The most duplicated family is the one an integrator cares about most: Device.'
entities:
- entity: Device
  description: The subscriber handset or IoT device. Every capability call resolves to a Device, identified
    by phoneNumber, networkAccessIdentifier, ipv4Address or ipv6Address. With a three-legged token the
    device is carried by the token and MUST be omitted from the body.
  schema_variants: 8
  example_schemas:
