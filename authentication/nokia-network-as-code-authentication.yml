summary:
  types: [apiKey, openIdConnect, oauth2]
  api_key_in: [header]
  oauth2_flows: [clientCredentials, authorizationCode]
  layers: 2
model: >-
  Two layers, and both are required for a subscriber-scoped call. Layer one is
  the channel: an x-rapidapi-key header validated by the RapidAPI Enterprise Hub
  gateway that fronts the whole platform. It is the only security requirement
  the gateway export declares, which makes the export look far simpler than the
  API really is. Layer two is the capability: a CAMARA OAuth2 / OpenID Connect
  access token, either two-legged (client credentials, the developer acting on
  its own behalf) or three-legged (the subscriber has consented), carrying
  purpose-based scopes. The CAMARA document is the only place layer two is
  specified.
