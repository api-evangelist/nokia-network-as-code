token_model:
  two_legged:
    grant: client_credentials
    subject: the developer/application
    identifier_rule: The subscriber MUST be identified in the request body (phoneNumber, networkAccessIdentifier, ipv4Address or ipv6Address).
    failure_if_omitted: 422 MISSING_IDENTIFIER
  three_legged:
    grant: authorization_code (subscriber consent)
    subject: the subscriber
    identifier_rule: The subscriber is carried inside the token and MUST NOT be repeated in the request body.
    failure_if_supplied: 422 UNNECESSARY_IDENTIFIER
  purpose_binding: >-
    CAMARA purpose-based consent. The string "purpose" appears throughout both
    documents, and subscription scopes name the exact CloudEvent type they
    authorise, so consent is event-granular rather than API-granular.
  ciba:
    supported: false
    note: >-
      No CIBA / backchannel-authentication / bc-authorize surface in either
      specification, so network-initiated authorization is implied by the
      three-legged model but not documented as a flow.
endpoints:
