discovery_note: >-
  All four endpoints above sit behind the gateway API key. An unauthenticated
  GET against the gateway host returns 404 "API doesn't exists" or 429. The
  practical consequence for an autonomous client is real: the documents that
  would let it discover the issuer, the supported flows and the JWKS are the
  documents it cannot read until it already has a credential.
webhook_authentication:
  direction: outbound to a consumer-hosted sink
  mechanism: sinkCredential object supplied by the consumer at subscription time
  credential_types: [ACCESSTOKEN]
  note: >-
    Nokia authenticates to the consumer's sink with the credential the consumer
    provided. There is no published request-signing scheme for verifying that a
    notification came from Nokia.
